version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # FluentAssertions 8+ moved to a paid commercial license;
      # the project intentionally pins the last freely-licensed version.
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
