name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # Required for NuGet trusted publishing (OIDC).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: |
          dotnet build druopc.slnx -c Release
          dotnet test tests -c Release --no-build --logger "console;verbosity=minimal"

      - name: Publish binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist

          for RID in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            for APP in simulator browser; do
              if [ "$APP" = "simulator" ]; then PROJECT=src; else PROJECT=browser; fi

              OUT="publish/druopc-$APP-$VERSION-$RID"
              dotnet publish "$PROJECT" -c Release -r "$RID" --self-contained \
                -p:PublishSingleFile=true -p:GeneratePackageOnBuild=false -o "$OUT"

              if [ "$RID" = "win-x64" ]; then
                (cd "$OUT" && zip -qr "../../dist/druopc-$APP-$VERSION-$RID.zip" .)
              else
                tar -czf "dist/druopc-$APP-$VERSION-$RID.tar.gz" -C "$OUT" .
              fi
            done
          done

          ls -lh dist/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container images to GHCR
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          for APP in simulator browser; do
            if [ "$APP" = "simulator" ]; then PROJECT=src; else PROJECT=browser; fi

            # The inner quotes reach MSBuild so the semicolon list parses as
            # one property value instead of a second (invalid) property.
            dotnet publish "$PROJECT" -c Release /t:PublishContainer \
              -p:ContainerRegistry=ghcr.io \
              -p:ContainerRepository="${{ github.repository_owner }}/druopc-$APP" \
              "-p:ContainerImageTags=\"$VERSION;latest\"" \
              -p:GeneratePackageOnBuild=false
          done

      # Uses nuget.org Trusted Publishing: the workflow exchanges a GitHub
      # OIDC token for a short-lived push key. Requires a trusted publishing
      # policy on nuget.org for drusteeby/DruOPC + release.yml.
      # continue-on-error: a NuGet hiccup must not sink the whole release.
      - name: NuGet login (trusted publishing)
        id: nuget_login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: drusteeby

      - name: Push NuGet package
        if: steps.nuget_login.outcome == 'success'
        continue-on-error: true
        run: |
          dotnet pack src -c Release -o nupkg
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Publish to the Snap Store (when SNAPCRAFT_STORE_CREDENTIALS is set)
        if: env.HAS_STORE_CREDENTIALS == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
