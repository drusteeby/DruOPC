name: druopc
base: core24
adopt-info: druopc
summary: OPC UA toolkit - PLC simulator and web-based browser
description: |
  DruOPC is a two-piece toolkit for learning, testing and demonstrating OPC UA.

  - druopc.simulator - an OPC UA server that behaves like a PLC: changing
    values, anomalies, boilers, events, alarms, methods and user-defined
    nodes. Listens on opc.tcp://localhost:50000.
  - druopc.browser - a web-based OPC UA client for browsing and inspecting
    any OPC UA server: live watch lists, writes, methods, events, alarms
    with acknowledge, history and more. Open http://localhost:5080 after
    starting it.

  Configure the simulator with OpcPlc__* environment variables, e.g.
  OpcPlc__Simulation__AddAlarmSimulation=true druopc.simulator

  Documentation: https://github.com/drusteeby/DruOPC

grade: stable
confinement: strict

platforms:
  amd64:

parts:
  druopc:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - git
      # The .NET SDK itself needs ICU in the build environment.
      - libicu74
    override-build: |
      craftctl set version="$(git -C "$CRAFT_PART_SRC" describe --tags --always | sed 's/^v//')"

      curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
      bash dotnet-install.sh --channel 10.0 --install-dir "$CRAFT_PART_BUILD/.dotnet"
      export PATH="$CRAFT_PART_BUILD/.dotnet:$PATH"
      export DOTNET_CLI_TELEMETRY_OPTOUT=1
      export DOTNET_NOLOGO=1

      # The simulator goes to the snap root: its content root is $SNAP, so
      # appsettings.json, nodesfile.json and the model files must live there.
      dotnet publish "$CRAFT_PART_SRC/src" -c Release -r linux-x64 --self-contained \
        -p:GeneratePackageOnBuild=false -o "$CRAFT_PART_INSTALL"

      dotnet publish "$CRAFT_PART_SRC/browser" -c Release -r linux-x64 --self-contained \
        -o "$CRAFT_PART_INSTALL/browser"
    stage-packages:
      - libicu74
      - libssl3t64

  wrappers:
    plugin: dump
    source: snap/local
    organize:
      simulator.sh: bin/simulator.sh
      browser.sh: bin/browser.sh

apps:
  simulator:
    command: bin/simulator.sh
    plugs:
      - network
      - network-bind
      - home
  browser:
    command: bin/browser.sh
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
    plugs:
      - network
      - network-bind
      - home
